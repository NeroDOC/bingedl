name: Release

# 1. Run this workflow manually ("Run workflow"): it computes the next SemVer from
#    Conventional Commits, regenerates CHANGELOG.md (Keep a Changelog), bumps VERSION in
#    bingedl and opens a "chore(release): vX.Y.Z" PR.
# 2. Squash-merge that PR: the push to main tags the release, publishes it and
#    attaches archives with ffmpeg/ffprobe.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bumped-version
      - name: Update CHANGELOG.md and VERSION
        env:
          NEXT: ${{ steps.next.outputs.content }}
        run: |
          NEXT=$(printf '%s' "$NEXT" | tail -1)
          case $NEXT in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad version: $NEXT" >&2; exit 1;; esac
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            echo "$NEXT already exists - nothing to release" >&2; exit 1
          fi
          echo "NEXT=$NEXT" >>"$GITHUB_ENV"
          sed -i "s/^VERSION=\".*\"/VERSION=\"${NEXT#v}\"/" bingedl
          grep -q "^VERSION=\"${NEXT#v}\"" bingedl
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ env.NEXT }}
        env:
          OUTPUT: CHANGELOG.md
      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/$NEXT"
          git commit -am "chore(release): $NEXT"
          git push -u origin "release/$NEXT"
          gh pr create --base main --title "chore(release): $NEXT" \
            --body "Generated by the Release workflow. Squash-merge to publish $NEXT."

  tag:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore(release): v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: t
        run: |
          tag="v$(sed -n 's/^VERSION="\(.*\)".*/\1/p' bingedl)"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: NOTES.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.t.outputs.tag }}" --title "${{ steps.t.outputs.tag }}" --notes-file NOTES.md

  assets:
    needs: tag
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-amd64}
          - {os: macos-latest, name: macos-arm64}
          - {os: macos-15-intel, name: macos-amd64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - name: Build archive
        run: |
          d="bingedl-${{ needs.tag.outputs.tag }}-${{ matrix.name }}"
          mkdir "$d"
          scripts/fetch-ffmpeg.sh "$d"
          cp bingedl LICENSE README.md "$d"/
          cat >"$d/FFMPEG-NOTICE.txt" <<'TXT'
          ffmpeg and ffprobe in this archive are unmodified GPL builds from
          https://ffmpeg.martin-riedl.de (source and build scripts are linked there).
          FFmpeg is licensed under the GPL: https://ffmpeg.org/legal.html
          TXT
          tar -czf "$d.tar.gz" "$d"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.tag.outputs.tag }}" bingedl-*.tar.gz --clobber
