name: PR title

# PRs are squash-merged, so the title becomes the commit message and must follow
# Conventional Commits 1.0.0 (it also drives the version bump and the changelog).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|refactor|perf|test|build|ci|chore|style|revert|deprecate|security)(\([a-z0-9._-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$re"; then
            echo "PR title must look like 'type(scope): description' (https://www.conventionalcommits.org/en/v1.0.0/)" >&2
            echo "got: $TITLE" >&2
            exit 1
          fi
